title: Suspicious Highlight Recruitment Indicators
id: TI-2026-001
status: experimental
description: Detects indicators related to a suspected fake Highlight recruitment campaign.
author: Mounir Kouskous
references:
  - Threat Intelligence Investigation TI-2026-001
logsource:
  category: proxy
detection:
  selection:
    url|contains:
      - "highlight-global.xyz"
      - "apihighlight.xyz"
      - "deeplink.apihighlight.xyz"
      - "cf.dot01mf.cfd"
      - "chat.imkefu.uk"
  condition: selection
falsepositives:
  - Unknown
level: high
tags:
  - attack.t1566
  - attack.t1036
  - attack.t1204
